# Evaluation Test Targets
#
# Spins up intentionally vulnerable applications for scanner evaluation.
# Usage: docker compose -f docker-compose.test.yml up -d
#
# Targets:
#  - DVWA (Damn Vulnerable Web Application) on port 8080
#  - Juice Shop on port 3000

services:
  dvwa:
    image: vulnerables/web-dvwa
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dvwa
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login.php"]
      interval: 10s
      timeout: 5s
      retries: 5

  juice-shop:
    image: bkimminich/juice-shop
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
